# Phase 3 smoke — SGLang prefiller (kv_producer-equivalent role).
#
# Runs on g126. Mounts the Phase 1 model PVC read-only. Exposes:
#   - 30001/tcp = SGLang API (router talks to it for prefill)
#   - 8998/tcp  = Mooncake bootstrap (decoder dials it for KV transfer setup)
#
# The router (12-router.yaml) reaches this pod via the Service in 20-services.yaml
# (prefiller.default.svc). The decoder reaches the Mooncake bootstrap port via
# the same Service. No hostNetwork — single-host smoke uses cluster networking
# only, mirroring what Phase 3 cross-DC will do *across* clusters via
# hostNetwork on the X side.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefiller-phase3-smoke
  namespace: default
  labels:
    prfaas.experiment/phase: "3-smoke"
    prfaas.role: kv_producer
    app.kubernetes.io/part-of: prfaas
    app: prefiller-phase3-smoke
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prefiller-phase3-smoke
  template:
    metadata:
      labels:
        app: prefiller-phase3-smoke
        prfaas.role: kv_producer
        prfaas.experiment/phase: "3-smoke"
        app.kubernetes.io/part-of: prfaas
    spec:
      nodeSelector:
        kubernetes.io/hostname: g126
      terminationGracePeriodSeconds: 30
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: model-weights-phase1
            readOnly: true
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
      containers:
        - name: sglang-prefiller
          image: lmsysorg/sglang:v0.5.9-cu129-amd64
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: prfaas-phase3-smoke-env
          env:
            - name: PRFAAS_GPU
              value: "H100 80GB SXM5"
            - name: NCCL_DEBUG
              value: "WARN"
            # SGLang reads MOONCAKE_PROTOCOL / MC_* from env when the
            # --disaggregation-transfer-backend mooncake flag is set. We
            # also set them on the pod (not just envFrom) so a partial
            # ConfigMap drift cannot accidentally turn them off.
            - name: MC_TCP_ENABLE_CONNECTION_POOL
              value: "1"
            - name: MC_LEGACY_RPC_PORT_BINDING
              value: "1"
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              echo "[prefiller-smoke] launching SGLang"
              echo "[prefiller-smoke] model:    ${MODEL_LOCAL_DIR}"
              echo "[prefiller-smoke] tp:       ${TP_SIZE}"
              echo "[prefiller-smoke] api:      :${PRFAAS_SGLANG_API_PORT}"
              echo "[prefiller-smoke] bootstrap: :${MOONCAKE_BOOTSTRAP_PORT}"

              if [[ ! -f "${MODEL_LOCAL_DIR}/config.json" ]]; then
                echo "[prefiller-smoke] FATAL: ${MODEL_LOCAL_DIR}/config.json missing."
                echo "[prefiller-smoke] Apply Phase 1's 02-model-staging-job-kimi.yaml first."
                exit 11
              fi

              echo "[prefiller-smoke] installing fla-core (Kimi-Linear KDA kernels)"
              pip install --no-cache-dir --quiet "fla-core>=${FLA_CORE_VERSION}"

              # NOTE on flag verification: this CLI shape comes from
              # scripts/tone_tests/scripts/test_1p1d_erdma.sh + common.sh
              # (in-tree integration tests for SGLang v0.5.x). On first
              # apply, exec into a paused container and run:
              #   python -m sglang.launch_server --help | grep -i disag
              # to confirm flag names. If they differ in v0.5.9 the patch
              # is one line in this file. See ENGINE_DECISION.md §Open items.
              exec python3 -m sglang.launch_server \
                --model-path "${MODEL_LOCAL_DIR}" \
                --served-model-name "${SERVED_MODEL_NAME}" \
                --host 0.0.0.0 \
                --port "${PRFAAS_SGLANG_API_PORT}" \
                --tp "${TP_SIZE}" \
                --trust-remote-code \
                --mem-fraction-static 0.65 \
                --disable-radix-cache \
                --disaggregation-mode prefill \
                --disaggregation-transfer-backend mooncake \
                --disaggregation-bootstrap-port "${MOONCAKE_BOOTSTRAP_PORT}" \
                --log-level info
          ports:
            - name: api
              containerPort: 30001
              protocol: TCP
            - name: bootstrap
              containerPort: 8998
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 30001
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: 30001
            initialDelaySeconds: 600
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: "4"
            limits:
              cpu: "16"
              memory: 128Gi
              nvidia.com/gpu: "4"
          volumeMounts:
            - name: model
              mountPath: /models
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
