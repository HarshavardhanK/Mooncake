# Phase 3 smoke — end-to-end probe Job.
#
# Sends a single short /v1/chat/completions request through the router. If
# this returns a 200 with a non-empty content body, the PD-disagg + Mooncake
# TCP path works on g126. If it 5xx's or hangs, see TROUBLESHOOTING.md
# (decoder bootstrap connect, fla-core import, port collision).
apiVersion: batch/v1
kind: Job
metadata:
  name: phase3-smoke-probe
  namespace: default
  labels:
    prfaas.experiment/phase: "3-smoke"
    prfaas.role: probe
    app.kubernetes.io/part-of: prfaas
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: phase3-smoke-probe
        prfaas.experiment/phase: "3-smoke"
        app.kubernetes.io/part-of: prfaas
    spec:
      restartPolicy: Never
      containers:
        - name: probe
          image: curlimages/curl:8.10.1
          envFrom:
            - configMapRef:
                name: prfaas-phase3-smoke-env
          command: ["sh", "-lc"]
          args:
            - |
              set -eu
              ROUTER="http://router.default.svc.cluster.local:${ROUTER_PORT}"
              echo "[probe] target router: ${ROUTER}"
              echo "[probe] waiting up to 10 minutes for router /health"
              for i in $(seq 1 120); do
                if curl -fsS --max-time 3 "${ROUTER}/health" >/dev/null 2>&1; then
                  echo "[probe] router up after ${i} attempts"
                  break
                fi
                sleep 5
              done

              echo "[probe] sending chat completion"
              RESP=$(curl -fsS --max-time 120 -X POST \
                -H 'Content-Type: application/json' \
                -d '{"model":"'"${SERVED_MODEL_NAME}"'","messages":[{"role":"user","content":"Reply with exactly: PASS"}],"max_tokens":8,"temperature":0}' \
                "${ROUTER}/v1/chat/completions")
              echo "[probe] raw response:"
              echo "${RESP}"
              echo "${RESP}" | grep -q '"content"' || { echo "[probe] FAIL: no content"; exit 2; }
              echo "[probe] PASS"
