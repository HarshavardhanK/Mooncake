# Stage B / Config P — prefiller on g304, decoder on g307.
#
# This is the PrfaaS pattern played locally: KV cache crosses the bootnet
# (10.10.34.0/24, 100 Gbps LACP, ~0.084 ms RTT). The prefiller pod's
# bootstrap port (8998) is exposed via the headless ClusterIP Service
# `prefiller-p-bootstrap`, which Cilium routes pod-to-pod across nodes
# without going through any NodePort or kube-proxy hop.
#
# Both pods include MC_TCP_ENABLE_CONNECTION_POOL=1 and
# MC_LEGACY_RPC_PORT_BINDING=1 from the ConfigMap. Bootnet is fast enough
# that the connection pool is not strictly required, but turning it on
# keeps Stage B's transport configuration identical to Stage 0a / Stage D
# so any Λ_max delta is attributable to the *wire*, not the *transport*.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefiller-p
  namespace: prfaas-stageb
  labels:
    prfaas.experiment/stage: "B"
    prfaas.config: "P"
    app.kubernetes.io/part-of: prfaas
    app: prefiller-p
    prfaas.role: kv_producer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prefiller-p
  template:
    metadata:
      labels:
        app: prefiller-p
        prfaas.experiment/stage: "B"
        prfaas.config: "P"
        prfaas.role: kv_producer
    spec:
      nodeSelector:
        kubernetes.io/hostname: g304
      terminationGracePeriodSeconds: 30
      volumes:
        - name: model
          hostPath:
            path: /scratch/models/nvidia_NVIDIA-Nemotron-Nano-9B-v2
            type: Directory
        - name: mc-pip
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
      initContainers:
        - name: install-mooncake
          image: python:3.11-slim
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              pip install --no-cache-dir --target=/opt/mc \
                'mooncake-transfer-engine==0.3.10.post1'
              python -c "import sys; sys.path.insert(0,'/opt/mc'); import mooncake; print('mooncake', mooncake.__file__)"
          volumeMounts:
            - name: mc-pip
              mountPath: /opt/mc
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.19.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: prfaas-stageb-env
          env:
            - name: PYTHONPATH
              value: "/opt/mc"
            - name: NCCL_DEBUG
              value: "WARN"
            - name: VLLM_HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              echo "[prefiller-p] sanity"
              command -v python3 && python3 --version
              python3 -c "import vllm, mooncake; print('vllm', vllm.__version__, 'mooncake', mooncake.__file__)" || \
                echo "[prefiller-p] sanity import failed (continuing)"
              nvidia-smi -L || true
              echo "[prefiller-p] env: pool=${MC_TCP_ENABLE_CONNECTION_POOL} legacy_rpc=${MC_LEGACY_RPC_PORT_BINDING} proto=${MC_TRANSPORT_PROTOCOL}"
              exec python3 -m vllm.entrypoints.openai.api_server \
                --model "${MODEL_LOCAL_DIR}" \
                --served-model-name "${SERVED_MODEL_NAME}" \
                --host 0.0.0.0 \
                --port "${PREFILLER_API_PORT}" \
                --tensor-parallel-size "${TENSOR_PARALLEL_SIZE}" \
                --max-model-len "${MAX_MODEL_LEN}" \
                --gpu-memory-utilization "${GPU_MEMORY_UTILIZATION}" \
                --trust-remote-code \
                --kv-transfer-config '{"kv_connector":"MooncakeConnector","kv_role":"kv_producer"}'
          ports:
            - name: api
              containerPort: 8010
            - name: bootstrap
              containerPort: 8998
          readinessProbe:
            httpGet:
              path: /v1/models
              port: api
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: "4"
            limits:
              cpu: "16"
              memory: 128Gi
              nvidia.com/gpu: "4"
          volumeMounts:
            - name: model
              mountPath: /models
              readOnly: true
            - name: mc-pip
              mountPath: /opt/mc
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
