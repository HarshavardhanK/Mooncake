# Stage B namespace + shared ConfigMap.
#
# X cluster (vpcloud-slurm-v2-admin / iad1) gives us cluster-admin, so we
# get a dedicated namespace `prfaas-stageb`. Everything Stage B carries
#   prfaas.experiment/stage=B
# plus a per-config label
#   prfaas.config=H | N | P
# so we can tear down a single config selectively, e.g.
#   kubectl delete -n prfaas-stageb deploy,svc,job,cm,pod \
#     -l prfaas.experiment/stage=B,prfaas.config=H
# or tear down everything in Stage B with
#   kubectl delete ns prfaas-stageb
---
apiVersion: v1
kind: Namespace
metadata:
  name: prfaas-stageb
  labels:
    prfaas.experiment/stage: "B"
    app.kubernetes.io/part-of: prfaas
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prfaas-stageb-env
  namespace: prfaas-stageb
  labels:
    prfaas.experiment/stage: "B"
    app.kubernetes.io/part-of: prfaas
data:
  # ------ model + serving ------
  PRIMARY_MODEL: "nvidia/NVIDIA-Nemotron-Nano-9B-v2"
  # hostPath model dir — MUST exist on each serving node before pods start.
  # The `01-model-staging-job-g304.yaml` / `02-model-staging-job-g307.yaml`
  # Jobs populate this path on g304 / g307 respectively.
  MODEL_LOCAL_DIR: "/models/nvidia_NVIDIA-Nemotron-Nano-9B-v2"
  MODEL_HOST_DIR: "/scratch/models/nvidia_NVIDIA-Nemotron-Nano-9B-v2"
  SERVED_MODEL_NAME: "nemotron-nano-9b-v2"
  TENSOR_PARALLEL_SIZE: "4"
  MAX_MODEL_LEN: "32768"
  GPU_MEMORY_UTILIZATION: "0.85"

  # ------ ports (per-pod, identical across configs) ------
  PREFILLER_API_PORT: "8010"
  DECODER_API_PORT: "8020"
  PROXY_PORT: "8000"
  VLLM_MOONCAKE_BOOTSTRAP_PORT: "8998"

  # ------ vLLM / Mooncake knobs ------
  VLLM_LOGGING_LEVEL: "INFO"
  VLLM_USE_V1: "1"
  HF_HUB_DOWNLOAD_TIMEOUT: "300"

  # Mandatory transport knobs from Stage 0a:
  #   - connection pool gives ~4× goodput on the bootnet/WAN path
  #   - legacy RPC port binding keeps Mooncake's bootstrap port deterministic
  # Bootnet (10.10.34.0/24, 100 Gbps LACP, 0.084 ms RTT) doesn't NEED the
  # pool to saturate KV transfer at this model size, but we keep it on for
  # parity with Stage 0a / Stage D.
  MC_TCP_ENABLE_CONNECTION_POOL: "1"
  MC_LEGACY_RPC_PORT_BINDING: "1"
  # Force Mooncake's transfer-engine to TCP for Stage B. Stage B+ will
  # flip this to `rdma` once the verbs path is validated.
  MC_TRANSPORT_PROTOCOL: "tcp"

  # ------ benchmark sweep knobs (consumed by bench/40-bench-job.yaml) ------
  # Default workload list and concurrency grid. The bench Job is launched
  # per-config; the operator can override CONCURRENCIES per run by patching
  # the Job spec or by editing this ConfigMap.
  BENCH_WORKLOADS: "chat_balanced long_context rag_summary code_complete"
  BENCH_CONCURRENCIES: "1 4 16 32 64 128 192"
  BENCH_NUM_FOLDS: "20"
  BENCH_STOP_ON_SLO_BREACH: "1"

  # SLO config (TTFT P95 ms ceilings, per workload). Same as host-side
  # `prfaas/m1.5-vllm-baseline/scripts/run_concurrency_sweep.sh`.
  TTFT_SLO_CHAT_BALANCED_MS: "1000"
  TTFT_SLO_LONG_CONTEXT_MS: "2000"
  TTFT_SLO_RAG_SUMMARY_MS: "1500"
  TTFT_SLO_CODE_COMPLETE_MS: "1500"

  # Where the bench Job writes its CSV+raw JSON output INSIDE the pod.
  # The Job mounts `/scratch/prfaas-results/stageB` from the host to this
  # path, so output survives Job deletion and is `scp`-able from the node.
  BENCH_RESULTS_DIR: "/results"
  BENCH_RESULTS_HOST_DIR: "/scratch/prfaas-results/stageB"
