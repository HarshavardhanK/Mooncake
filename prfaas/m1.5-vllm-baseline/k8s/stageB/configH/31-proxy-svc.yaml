# ClusterIP front-door for the Config-H proxy. The bench Job dials
# proxy-h.prfaas-stageb.svc.cluster.local:8000.
apiVersion: v1
kind: Service
metadata:
  name: proxy-h
  namespace: prfaas-stageb
  labels:
    prfaas.experiment/stage: "B"
    prfaas.config: "H"
    app.kubernetes.io/part-of: prfaas
spec:
  type: ClusterIP
  selector:
    app: proxy-h
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
