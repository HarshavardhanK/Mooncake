# Front-door OpenAI HTTP for the Config-N decoder; consumed by the proxy.
apiVersion: v1
kind: Service
metadata:
  name: decoder-n-api
  namespace: prfaas-stageb
  labels:
    prfaas.experiment/stage: "B"
    prfaas.config: "N"
    app.kubernetes.io/part-of: prfaas
spec:
  type: ClusterIP
  selector:
    app: decoder-n
  ports:
    - name: http
      port: 8020
      targetPort: api
      protocol: TCP
