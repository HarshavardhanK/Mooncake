# Stage B / Config N — prefiller on g307 (single-node PD, sanity baseline).
#
# Identical to Config H but pinned to g307 instead of g304. Purpose:
# replicate the H result on the *other* node to confirm Λ_max(H) is not a
# per-node artifact (different thermal envelope, different IB card, etc.).
# If Λ_max(H) ≠ Λ_max(N) on g304-vs-g307 within ~5%, that's a node-level
# anomaly we need to chase before trusting any P-vs-H comparison.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefiller-n
  namespace: prfaas-stageb
  labels:
    prfaas.experiment/stage: "B"
    prfaas.config: "N"
    app.kubernetes.io/part-of: prfaas
    app: prefiller-n
    prfaas.role: kv_producer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prefiller-n
  template:
    metadata:
      labels:
        app: prefiller-n
        prfaas.experiment/stage: "B"
        prfaas.config: "N"
        prfaas.role: kv_producer
    spec:
      nodeSelector:
        kubernetes.io/hostname: g307
      terminationGracePeriodSeconds: 30
      volumes:
        - name: model
          hostPath:
            path: /scratch/models/nvidia_NVIDIA-Nemotron-Nano-9B-v2
            type: Directory
        - name: mc-pip
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
      initContainers:
        - name: install-mooncake
          image: python:3.11-slim
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              pip install --no-cache-dir --target=/opt/mc \
                'mooncake-transfer-engine==0.3.10.post1'
              python -c "import sys; sys.path.insert(0,'/opt/mc'); import mooncake; print('mooncake', mooncake.__file__)"
          volumeMounts:
            - name: mc-pip
              mountPath: /opt/mc
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.19.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: prfaas-stageb-env
          env:
            - name: PYTHONPATH
              value: "/opt/mc"
            - name: NCCL_DEBUG
              value: "WARN"
            - name: VLLM_HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              echo "[prefiller-n] sanity"
              command -v python3 && python3 --version
              python3 -c "import vllm, mooncake; print('vllm', vllm.__version__, 'mooncake', mooncake.__file__)" || \
                echo "[prefiller-n] sanity import failed (continuing)"
              nvidia-smi -L || true
              exec python3 -m vllm.entrypoints.openai.api_server \
                --model "${MODEL_LOCAL_DIR}" \
                --served-model-name "${SERVED_MODEL_NAME}" \
                --host 0.0.0.0 \
                --port "${PREFILLER_API_PORT}" \
                --tensor-parallel-size "${TENSOR_PARALLEL_SIZE}" \
                --max-model-len "${MAX_MODEL_LEN}" \
                --gpu-memory-utilization "${GPU_MEMORY_UTILIZATION}" \
                --trust-remote-code \
                --kv-transfer-config '{"kv_connector":"MooncakeConnector","kv_role":"kv_producer"}'
          ports:
            - name: api
              containerPort: 8010
            - name: bootstrap
              containerPort: 8998
          readinessProbe:
            httpGet:
              path: /v1/models
              port: api
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: "4"
            limits:
              cpu: "16"
              memory: 128Gi
              nvidia.com/gpu: "4"
          volumeMounts:
            - name: model
              mountPath: /models
              readOnly: true
            - name: mc-pip
              mountPath: /opt/mc
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
