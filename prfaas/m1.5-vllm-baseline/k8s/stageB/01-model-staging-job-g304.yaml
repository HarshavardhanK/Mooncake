# One-shot Job that downloads NVIDIA-Nemotron-Nano-9B-v2 to
# /scratch/models/nvidia_NVIDIA-Nemotron-Nano-9B-v2 on g304 via hostPath.
#
# Why per-node Jobs and not a shared PVC: cluster X has NO StorageClass
# (see prfaas/m1.5-vllm-baseline/k8s/DISCOVERY.md §"X cluster"). Pre-staging
# the model into each node's local /scratch (14 TB free per DISCOVERY) is
# the simplest path that still keeps `kubectl apply` as the only host
# touch.
#
# Idempotent: if config.json + at least one .safetensors already exists at
# the target path, the Job exits 0 without re-downloading.
#
# Verification before launching any configH/configN/configP manifest:
#   kubectl -n prfaas-stageb wait --for=condition=complete job/model-stage-g304 --timeout=45m
#   kubectl -n prfaas-stageb logs job/model-stage-g304 --tail=30
# Then SSH-side spot check (operator):
#   ssh vpsupport@159.26.81.50 'ls /scratch/models/nvidia_NVIDIA-Nemotron-Nano-9B-v2 | head'
apiVersion: batch/v1
kind: Job
metadata:
  name: model-stage-g304
  namespace: prfaas-stageb
  labels:
    prfaas.experiment/stage: "B"
    app.kubernetes.io/part-of: prfaas
    prfaas.role: model-staging
    prfaas.node: g304
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: model-stage-g304
        prfaas.experiment/stage: "B"
        prfaas.role: model-staging
        prfaas.node: g304
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: g304
      tolerations:
        - operator: Exists
      containers:
        - name: hf-downloader
          image: python:3.11-slim
          envFrom:
            - configMapRef:
                name: prfaas-stageb-env
          env:
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "1"
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              echo "[stage] node=g304 target=${MODEL_LOCAL_DIR}"
              mkdir -p "${MODEL_LOCAL_DIR}"
              if [[ -f "${MODEL_LOCAL_DIR}/config.json" ]] && \
                 ls "${MODEL_LOCAL_DIR}"/*.safetensors >/dev/null 2>&1; then
                echo "[stage] model already present, skipping download"
                du -sh "${MODEL_LOCAL_DIR}"
                ls -lh "${MODEL_LOCAL_DIR}" | head -20
                exit 0
              fi
              echo "[stage] installing huggingface_hub + hf-transfer"
              pip install --no-cache-dir --quiet \
                'huggingface_hub[cli,hf_transfer]==0.27.*'
              echo "[stage] downloading ${PRIMARY_MODEL}"
              huggingface-cli download "${PRIMARY_MODEL}" \
                --local-dir "${MODEL_LOCAL_DIR}" \
                --max-workers 8
              echo "[stage] done"
              du -sh "${MODEL_LOCAL_DIR}"
              ls -lh "${MODEL_LOCAL_DIR}" | head -20
          volumeMounts:
            - name: model
              mountPath: /models
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "8"
              memory: 16Gi
      volumes:
        - name: model
          hostPath:
            # /scratch is 14 TB on each X-cluster node (DISCOVERY.md §X)
            path: /scratch/models
            type: DirectoryOrCreate
