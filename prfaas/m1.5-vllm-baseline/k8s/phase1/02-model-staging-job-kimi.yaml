# Stage Phase 1's H1 model: moonshotai/Kimi-Linear-48B-A3B-Instruct.
# 49 GiB BF16, MIT license, public — no HF token required.
#
# Idempotent: skips download if config.json + at least one .safetensors shard
# is already present at the target path. Safe to re-apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: model-staging-kimi-linear-48b
  namespace: default
  labels:
    prfaas.experiment/phase: "1"
    prfaas.experiment/model: "kimi-linear-48b"
    app.kubernetes.io/part-of: prfaas
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: model-staging-kimi-linear-48b
        prfaas.experiment/phase: "1"
        prfaas.experiment/model: "kimi-linear-48b"
        app.kubernetes.io/part-of: prfaas
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: g126
      containers:
        - name: hf-downloader
          image: python:3.12-slim
          envFrom:
            - configMapRef:
                name: prfaas-phase1-env
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              echo "[stage] installing huggingface_hub + hf-transfer"
              pip install --no-cache-dir --quiet \
                'huggingface_hub[cli,hf_transfer]==0.27.*'
              echo "[stage] target dir: ${H1_MODEL_LOCAL_DIR}"
              mkdir -p "${H1_MODEL_LOCAL_DIR}"
              if [[ -f "${H1_MODEL_LOCAL_DIR}/config.json" ]] && \
                 ls "${H1_MODEL_LOCAL_DIR}"/*.safetensors >/dev/null 2>&1; then
                echo "[stage] model already present, skipping download"
                du -sh "${H1_MODEL_LOCAL_DIR}"
                ls "${H1_MODEL_LOCAL_DIR}"
                exit 0
              fi
              echo "[stage] downloading ${H1_MODEL_REPO} (paper hybrid H1)"
              huggingface-cli download "${H1_MODEL_REPO}" \
                --local-dir "${H1_MODEL_LOCAL_DIR}" \
                --max-workers 8
              echo "[stage] done"
              du -sh "${H1_MODEL_LOCAL_DIR}"
              ls "${H1_MODEL_LOCAL_DIR}"
          volumeMounts:
            - name: model
              mountPath: /models
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "8"
              memory: 16Gi
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: model-weights-phase1
