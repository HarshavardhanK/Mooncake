# One-shot Job that downloads Nemotron-Nano-9B-v2 to the model PVC.
# Runs once. ~18 GB of safetensors, takes ~15-30 min on commercial WAN.
apiVersion: batch/v1
kind: Job
metadata:
  name: model-staging
  labels:
    prfaas.experiment/stage: "A"
    app.kubernetes.io/part-of: prfaas
  namespace: default
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: model-staging
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: g126
      containers:
        - name: hf-downloader
          image: python:3.11-slim
          envFrom:
            - configMapRef:
                name: prfaas-stagea-env
          env:
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "1"
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              echo "[stage] installing huggingface_hub + hf-transfer"
              pip install --no-cache-dir --quiet 'huggingface_hub[cli,hf_transfer]==0.27.*'
              echo "[stage] target dir: ${MODEL_LOCAL_DIR}"
              mkdir -p "${MODEL_LOCAL_DIR}"
              if [[ -f "${MODEL_LOCAL_DIR}/config.json" ]] && \
                 ls "${MODEL_LOCAL_DIR}"/*.safetensors >/dev/null 2>&1; then
                echo "[stage] model already present, skipping download"
                du -sh "${MODEL_LOCAL_DIR}"
                exit 0
              fi
              echo "[stage] downloading ${PRIMARY_MODEL}"
              huggingface-cli download "${PRIMARY_MODEL}" \
                --local-dir "${MODEL_LOCAL_DIR}" \
                --max-workers 8
              echo "[stage] done"
              du -sh "${MODEL_LOCAL_DIR}"
              ls "${MODEL_LOCAL_DIR}"
          volumeMounts:
            - name: model
              mountPath: /models
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: model-weights
