# Stage D — Y-side decoder (kv_consumer), pinned to g126.
#
# Pod stays in the *normal* pod netns (NO hostNetwork). The decoder only
# initiates outbound to the prefiller; egress goes through Cilium's default
# SNAT to g126's public IP, which X has already whitelisted on its iptables
# rules (Stage 0a opened 13000-17000 on g304 sourced from g126; the operator
# will extend with TCP 8998 for Stage D — see firewall/g304-stageD-iptables.sh).
#
# Why a separate Deployment from Stage A's `decoder`
#   Stage D needs different env (mandatory cross-DC knobs, mooncake_protocol
#   pinned to tcp, distinct port 8021 to coexist with Stage A on the same
#   node). Cleaner to have a parallel `decoder-staged` than to mutate Stage A
#   in place. The Stage A decoder remains untouched and serves as the
#   Config H baseline.
#
# Model weights: reuses Stage A's `model-weights` PVC. K8s >= 1.22 lets two
# pods on the same node mount one RWO PVC concurrently, so this is safe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: decoder-staged
  namespace: default
  labels:
    prfaas.experiment/stage: "D"
    prfaas.config: "P"
    app.kubernetes.io/part-of: prfaas
    app: decoder-staged
    prfaas.role: kv_consumer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: decoder-staged
  template:
    metadata:
      labels:
        app: decoder-staged
        prfaas.role: kv_consumer
        prfaas.experiment/stage: "D"
        prfaas.config: "P"
    spec:
      nodeSelector:
        kubernetes.io/hostname: g126
      terminationGracePeriodSeconds: 30
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: model-weights
        - name: mc-pip
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
      initContainers:
        - name: install-mooncake
          image: python:3.11-slim
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              pip install --no-cache-dir --target=/opt/mc \
                'mooncake-transfer-engine==0.3.10.post1'
              python3 -c "import sys; sys.path.insert(0,'/opt/mc'); import mooncake; print('mooncake', mooncake.__file__)"
          volumeMounts:
            - name: mc-pip
              mountPath: /opt/mc
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.19.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: prfaas-staged-env
          env:
            - name: PYTHONPATH
              value: "/opt/mc"
            - name: NCCL_DEBUG
              value: "WARN"
            - name: VLLM_HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Mandatory cross-DC TCP knobs (also in ConfigMap; belt + braces).
            - name: MC_TCP_ENABLE_CONNECTION_POOL
              value: "1"
            - name: MC_LEGACY_RPC_PORT_BINDING
              value: "1"
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              echo "[decoder-staged] sanity"
              command -v python3 && python3 --version
              python3 -c "import vllm, mooncake; print('vllm', vllm.__version__, 'mooncake', mooncake.__file__)" || \
                echo "[decoder-staged] sanity import failed (continuing)"
              nvidia-smi -L || true
              echo "[decoder-staged] cross-DC prefiller target: ${PREFILLER_HOST}:${PREFILLER_BOOTSTRAP_PORT}"
              exec python3 -m vllm.entrypoints.openai.api_server \
                --model "${MODEL_LOCAL_DIR}" \
                --served-model-name nemotron-nano-9b-v2 \
                --host 0.0.0.0 \
                --port "${DECODER_API_PORT}" \
                --tensor-parallel-size "${TENSOR_PARALLEL_SIZE}" \
                --max-model-len 32768 \
                --gpu-memory-utilization 0.85 \
                --trust-remote-code \
                --kv-transfer-config '{"kv_connector":"MooncakeConnector","kv_role":"kv_consumer","kv_buffer_size":1000000000,"kv_parallel_size":1,"kv_connector_extra_config":{"num_workers":10,"mooncake_protocol":"tcp"}}'
          ports:
            - name: api
              containerPort: 8021
          readinessProbe:
            httpGet:
              path: /v1/models
              port: api
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: "4"
            limits:
              cpu: "16"
              memory: 128Gi
              nvidia.com/gpu: "4"
          volumeMounts:
            - name: model
              mountPath: /models
              readOnly: true
            - name: mc-pip
              mountPath: /opt/mc
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
---
# ClusterIP for the proxy to reach the decoder. ClusterIP is fine here —
# both proxy and decoder live in the same cluster (Y).
apiVersion: v1
kind: Service
metadata:
  name: decoder-staged-api
  namespace: default
  labels:
    prfaas.experiment/stage: "D"
    prfaas.config: "P"
    app.kubernetes.io/part-of: prfaas
spec:
  type: ClusterIP
  selector:
    app: decoder-staged
  ports:
    - name: http
      port: 8021
      targetPort: api
      protocol: TCP
