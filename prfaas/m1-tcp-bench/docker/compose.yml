# PrfaaS M1 — two-"DC" cross-link, with NET_ADMIN so we can apply tc netem
# inside each container to emulate WAN conditions.
#
#   cd prfaas/m1-tcp-bench/docker
#   docker compose build
#   docker compose up -d
#   docker compose exec dc_a /work/scripts/run_target.sh
#   docker compose exec dc_b /work/scripts/run_initiator.sh ...
#
# Both containers share the same user-defined bridge so they can reach each
# other by name (`dc_a`, `dc_b`). Latency/loss/cap is added by `apply_wan.sh`
# inside the *initiator* container's egress qdisc; that mirrors a one-sided
# WAN profile, which is enough for throughput characterization.

name: prfaas-m1

services:
  dc_a:
    image: prfaas/m1-bench
    build:
      context: ../../..              # repo root
      dockerfile: prfaas/m1-tcp-bench/docker/Dockerfile
    container_name: prfaas_m1_dc_a
    hostname: dc_a
    cap_add:
      - NET_ADMIN                    # required for tc netem
    sysctls:
      # Generous TCP buffers so we don't bottleneck on socket sizing during
      # high-BDP profiles.
      net.core.rmem_max: 268435456
      net.core.wmem_max: 268435456
      net.ipv4.tcp_rmem: "4096 87380 268435456"
      net.ipv4.tcp_wmem: "4096 65536 268435456"
    ulimits:
      memlock: -1
      nofile: 1048576
    networks:
      wan:
    command: ["sleep", "infinity"]

  dc_b:
    image: prfaas/m1-bench
    container_name: prfaas_m1_dc_b
    hostname: dc_b
    cap_add:
      - NET_ADMIN
    sysctls:
      net.core.rmem_max: 268435456
      net.core.wmem_max: 268435456
      net.ipv4.tcp_rmem: "4096 87380 268435456"
      net.ipv4.tcp_wmem: "4096 65536 268435456"
    ulimits:
      memlock: -1
      nofile: 1048576
    networks:
      wan:
    command: ["sleep", "infinity"]
    volumes:
      - ../results:/work/results     # initiator writes CSVs here

networks:
  wan:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "9000"
